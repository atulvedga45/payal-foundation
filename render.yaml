services:
  - type: web
    name: payal-foundation-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: payal-foundation-db
          property: connectionString
      - key: ADMIN_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://payal-foundation.vercel.app,https://your-vercel-url.vercel.app"
      - key: FAST2SMS_API_KEY
        sync: false
      - key: SMS_NOTIFY_NUMBERS
        value: "9225243552,8766573113"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: payalfoundation212@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: NOTIFY_EMAIL
        value: payalfoundation212@gmail.com
      - key: UPLOADS_PATH
        value: /opt/render/project/src/uploads
    disk:
      name: uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 1

databases:
  - name: payal-foundation-db
    databaseName: payal_foundation
    plan: free
